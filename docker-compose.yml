# docker compose up -d
#
# Before first run create ./data and place credentials there:
#   data/auth.json   — for cloud/* models (otherwise Web-Only)
#   data/cookie.txt  — for web/* models (Gemini browser cookies)
services:
  antigravity-api:
    build: .
    image: antigravity-api:local
    container_name: antigravity-api
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:8317:8317"
    environment:
      AG_HOST: 0.0.0.0
      AG_PORT: "8317"
      AG_NO_CLOUD: ${AG_NO_CLOUD:-}
      AG_MAX_BODY_BYTES: "16777216"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:$${AG_PORT}/_health\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
