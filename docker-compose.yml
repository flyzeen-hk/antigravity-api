# docker compose up -d
#
# Перед первым запуском создайте на хосте ./data и положите туда:
#   auth.json   — для cloud/* моделей (иначе только web/*)
#   cookie.txt  — для web/* моделей (cookie Gemini из браузера)
# config.json, apikey.txt и admin.key создадутся сами. Где что лежит:
#   data/apikey.txt  — клиентский API-ключ
#   data/admin.key   — ключ панели, /_config и управления веб-аккаунтами
services:
  antigravity-api:
    build: .
    image: antigravity-api:local
    container_name: antigravity-api
    restart: unless-stopped
    # Совпадает с пользователем в образе (node, uid 1000): иначе Docker создаст
    # ./data от root, и сервер не сможет туда писать.
    user: "1000:1000"
    ports:
      # Только localhost: шлюз не должен торчать в сеть без adminKey/TLS.
      - "127.0.0.1:8317:8317"
    environment:
      AG_HOST: 0.0.0.0
      AG_PORT: "8317"
      # Только веб-модели, без auth.json: раскомментируйте строку ниже.
      # AG_NO_CLOUD: "1"
      # Тело запроса: 16 МБ по умолчанию, увеличьте для больших картинок.
      AG_MAX_BODY_BYTES: "16777216"
    volumes:
      # Всё изменяемое живёт здесь: config, ключи, usage, backups, agent workspace.
      - ./data:/data
    # Всё, что нужно писать, уже в /data — корень образа можно держать только для чтения.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Порт берём из окружения: при смене AG_PORT проверка не сломается.
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:$${AG_PORT}/_health\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
